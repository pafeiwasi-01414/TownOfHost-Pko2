name: Discord Notification

on:
  push:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: Discord Webhook URL is missing!"
            exit 1
          fi

          CONTENT="📢 TOHPko Update!
          Repository: ${REPO}
          Event: ${EVENT}
          User: ${ACTOR}
          Commit: ${GITHUB_SERVER_URL}/${REPO}/commit/${GITHUB_SHA}"

          jq -n --arg content "$CONTENT" \
            '{content: $content}' > payload.json

          curl --fail-with-body --silent --show-error --request POST --header "Content-Type: application/json" --data-binary @payload.json "$DISCORD_WEBHOOK_URL"
